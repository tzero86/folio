<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rounded dark background -->
  <rect width="1024" height="1024" rx="224" fill="#0f1117"/>

  <!-- Subtle inner glow ring -->
  <rect x="28" y="28" width="968" height="968" rx="200" fill="none" stroke="#1e2029" stroke-width="16"/>

  <!-- Open book, left page -->
  <path d="M512 330
           C 468 296, 380 268, 284 268
           C 236 268, 196 278, 164 296
           L 164 720
           C 200 700, 240 692, 292 692
           C 392 692, 476 716, 512 748 Z"
        fill="#84cc16"/>

  <!-- Open book, right page -->
  <path d="M512 330
           C 556 296, 644 268, 740 268
           C 788 268, 828 278, 860 296
           L 860 720
           C 824 700, 784 692, 732 692
           C 632 692, 548 716, 512 748 Z"
        fill="#a3e635"/>

  <!-- Page lines, left -->
  <g stroke="#3f6212" stroke-width="18" stroke-linecap="round">
    <line x1="236" y1="400" x2="436" y2="412"/>
    <line x1="236" y1="480" x2="436" y2="492"/>
    <line x1="236" y1="560" x2="436" y2="572"/>
  </g>

  <!-- Page lines, right -->
  <g stroke="#4d7c0f" stroke-width="18" stroke-linecap="round">
    <line x1="588" y1="412" x2="788" y2="400"/>
    <line x1="588" y1="492" x2="788" y2="480"/>
    <line x1="588" y1="572" x2="788" y2="560"/>
  </g>

  <!-- Bookmark ribbon -->
  <path d="M470 250 L470 480 L512 448 L554 480 L554 250 Z" fill="#1a2e05"/>
  <path d="M470 250 L554 250 L554 290 L470 290 Z" fill="#84cc16"/>
</svg>
